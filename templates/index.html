<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPS Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a1a;
    --bg2: #0f0f2e;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.12);
    --neon: #a855f7;
    --cyan: #22d3ee;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --card: rgba(15,15,46,0.8);
  }
  [data-theme="light"] {
    --bg: #f0f4ff;
    --bg2: #e2e8f8;
    --glass: rgba(255,255,255,0.6);
    --glass-border: rgba(100,100,200,0.2);
    --neon: #7c3aed;
    --cyan: #0891b2;
    --text: #1e1b4b;
    --text2: #475569;
    --card: rgba(240,244,255,0.8);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* ── Animated Background ── */
  #bg-canvas {
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .blob {
    position:fixed; border-radius:50%; filter:blur(80px); opacity:0.18;
    animation:blobMove 12s infinite alternate ease-in-out;
    pointer-events:none; z-index:0;
  }
  .blob1{ width:500px;height:500px;background:#a855f7;top:-100px;left:-100px;animation-duration:14s;}
  .blob2{ width:400px;height:400px;background:#22d3ee;bottom:-80px;right:-80px;animation-duration:10s;}
  .blob3{ width:300px;height:300px;background:#f59e0b;top:40%;left:40%;animation-duration:18s;}
  @keyframes blobMove {
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(60px,40px) scale(1.15);}
  }

  /* ── Splash Screen ── */
  #splash {
    position:fixed; inset:0; z-index:1000;
    background:linear-gradient(135deg,#0a0a1a 0%,#1a0533 50%,#0a1a2e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; transition:opacity 0.8s, visibility 0.8s;
  }
  #splash.hidden { opacity:0; visibility:hidden; }
  .splash-logo {
    font-family:'Righteous',sans-serif;
    font-size:clamp(2.5rem,8vw,5rem);
    background:linear-gradient(135deg,#a855f7,#22d3ee);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow {
    from{filter:drop-shadow(0 0 20px #a855f7);}
    to{filter:drop-shadow(0 0 40px #22d3ee);}
  }
  .splash-hands { font-size:clamp(3rem,10vw,6rem); animation:bounceHands 1s infinite alternate; }
  @keyframes bounceHands {
    from{transform:scale(1) translateY(0);}
    to{transform:scale(1.1) translateY(-10px);}
  }
  .splash-bar-wrap {
    width:260px; height:6px; background:rgba(255,255,255,0.1);
    border-radius:99px; overflow:hidden;
  }
  .splash-bar {
    height:100%; width:0%;
    background:linear-gradient(90deg,#a855f7,#22d3ee);
    border-radius:99px; transition:width 0.05s linear;
  }
  .splash-tip { color:#94a3b8; font-size:0.85rem; }

  /* ── Layout ── */
  #app { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:16px; }

  /* ── Header ── */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:20px; backdrop-filter:blur(20px);
    margin-bottom:20px;
  }
  .logo {
    font-family:'Righteous',sans-serif; font-size:1.4rem;
    background:linear-gradient(135deg,#a855f7,#22d3ee);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header-actions { display:flex; gap:10px; align-items:center; }
  .icon-btn {
    width:40px;height:40px; border-radius:12px; border:1px solid var(--glass-border);
    background:var(--glass); color:var(--text); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem; transition:all 0.2s; backdrop-filter:blur(10px);
  }
  .icon-btn:hover { transform:scale(1.1); border-color:var(--neon); }

  /* ── Score Bar ── */
  .score-bar {
    display:grid; grid-template-columns:1fr auto 1fr;
    gap:12px; margin-bottom:20px; align-items:center;
  }
  .score-card {
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:20px; padding:16px; text-align:center;
    backdrop-filter:blur(20px);
  }
  .score-label { font-size:0.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px; }
  .score-num {
    font-family:'Righteous',sans-serif; font-size:2.5rem;
    background:linear-gradient(135deg,#a855f7,#22d3ee);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .vs-badge {
    font-family:'Righteous',sans-serif; font-size:1.2rem; color:var(--text2);
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:50%; width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(10px);
  }

  /* ── Battle Arena ── */
  .arena {
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:24px; padding:28px; text-align:center;
    backdrop-filter:blur(20px); margin-bottom:20px;
    position:relative; overflow:hidden;
  }
  .arena-hands {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; gap:16px;
  }
  .hand-slot {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .hand-emoji {
    font-size:clamp(3rem,10vw,5.5rem);
    transition:transform 0.3s;
    display:block; min-height:90px; line-height:90px;
  }
  .hand-slot.player .hand-emoji { transform:scaleX(-1); }
  .hand-label { font-size:0.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px; }
  .hand-name { font-family:'Righteous',sans-serif; font-size:1rem; color:var(--text); }

  .result-text {
    font-family:'Righteous',sans-serif;
    font-size:clamp(1.4rem,4vw,2rem);
    min-height:48px; display:flex; align-items:center; justify-content:center;
    transition:all 0.3s;
  }
  .result-text.win  { color:var(--green); text-shadow:0 0 20px #4ade80; }
  .result-text.lose { color:var(--red);   text-shadow:0 0 20px #f87171; }
  .result-text.draw { color:var(--yellow);text-shadow:0 0 20px #fbbf24; }

  /* AI Thinking */
  .ai-thinking {
    display:none; flex-direction:column; align-items:center; gap:8px;
    margin-bottom:12px;
  }
  .ai-thinking.active { display:flex; }
  .think-label { font-size:0.8rem; color:var(--neon); }
  .think-dots { display:flex; gap:6px; }
  .think-dot {
    width:8px;height:8px;border-radius:50%;background:var(--neon);
    animation:thinkBounce 0.8s infinite alternate;
  }
  .think-dot:nth-child(2){animation-delay:0.2s;}
  .think-dot:nth-child(3){animation-delay:0.4s;}
  @keyframes thinkBounce {
    from{transform:translateY(0);opacity:0.4;}
    to{transform:translateY(-8px);opacity:1;}
  }

  /* ── Choices ── */
  .choices {
    display:flex; justify-content:center; gap:16px;
    flex-wrap:wrap; margin-bottom:20px;
  }
  .choice-btn {
    width:110px; height:110px; border-radius:24px;
    background:var(--glass); border:2px solid var(--glass-border);
    cursor:pointer; transition:all 0.2s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px; backdrop-filter:blur(20px); color:var(--text);
    position:relative; overflow:hidden;
  }
  .choice-btn::before {
    content:''; position:absolute; inset:0; opacity:0;
    background:linear-gradient(135deg,#a855f722,#22d3ee22);
    transition:opacity 0.2s;
  }
  .choice-btn:hover { transform:translateY(-6px) scale(1.05); border-color:var(--neon); box-shadow:0 8px 30px rgba(168,85,247,0.3); }
  .choice-btn:hover::before { opacity:1; }
  .choice-btn:active { transform:scale(0.95); }
  .choice-btn .emoji { font-size:2.5rem; }
  .choice-btn .label { font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; color:var(--text2); }
  .choice-btn.selected { border-color:var(--cyan); box-shadow:0 0 20px rgba(34,211,238,0.4); }

  /* ── Bottom Grid ── */
  .bottom-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  @media(max-width:560px){ .bottom-grid{ grid-template-columns:1fr; } }

  .panel {
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:20px; padding:20px; backdrop-filter:blur(20px);
  }
  .panel-title {
    font-family:'Righteous',sans-serif; font-size:0.95rem;
    color:var(--neon); margin-bottom:14px; display:flex; align-items:center; gap:6px;
  }

  /* Stats */
  .stat-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stat-label { font-size:0.82rem; color:var(--text2); }
  .stat-val { font-family:'Righteous',sans-serif; font-size:1rem; color:var(--text); }
  .stat-bar-wrap { height:4px; background:rgba(255,255,255,0.1); border-radius:99px; margin-top:4px; }
  .stat-bar-fill {
    height:100%; border-radius:99px;
    background:linear-gradient(90deg,#a855f7,#22d3ee);
    transition:width 0.6s ease;
  }
  .streak-badge {
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg,#a855f722,#22d3ee22);
    border:1px solid var(--neon); border-radius:99px;
    padding:4px 12px; font-size:0.82rem; color:var(--neon);
  }

  /* Achievements */
  .achievements-grid { display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; }
  .achievement {
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:12px;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
    transition:all 0.3s;
  }
  .achievement.unlocked { border-color:rgba(251,191,36,0.4); background:rgba(251,191,36,0.08); }
  .ach-icon { font-size:1.4rem; filter:grayscale(1); transition:filter 0.3s; }
  .achievement.unlocked .ach-icon { filter:grayscale(0); }
  .ach-info { flex:1; }
  .ach-name { font-size:0.82rem; font-weight:600; color:var(--text2); }
  .achievement.unlocked .ach-name { color:var(--yellow); }
  .ach-desc { font-size:0.72rem; color:var(--text2); }

  /* History */
  .history-list { display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; }
  .history-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; border-radius:10px;
    background:rgba(255,255,255,0.03);
    font-size:0.8rem;
  }
  .history-item .badge {
    padding:2px 8px; border-radius:99px; font-size:0.7rem; font-weight:700;
  }
  .badge.win  { background:rgba(74,222,128,0.15); color:var(--green); }
  .badge.lose { background:rgba(248,113,113,0.15); color:var(--red); }
  .badge.draw { background:rgba(251,191,36,0.15); color:var(--yellow); }

  /* ── Confetti ── */
  #confetti-canvas { position:fixed;inset:0;z-index:999;pointer-events:none; }

  /* ── Achievement Toast ── */
  #ach-toast {
    position:fixed; bottom:30px; right:20px; z-index:900;
    background:linear-gradient(135deg,#a855f7,#22d3ee);
    border-radius:16px; padding:14px 20px;
    display:flex; align-items:center; gap:12px;
    transform:translateY(100px); opacity:0;
    transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    box-shadow:0 8px 32px rgba(168,85,247,0.4);
    max-width:300px;
  }
  #ach-toast.show { transform:translateY(0); opacity:1; }
  #ach-toast .ach-toast-icon { font-size:2rem; }
  #ach-toast .ach-toast-text { font-size:0.85rem; color:#fff; }
  #ach-toast .ach-toast-title { font-weight:700; font-size:0.95rem; }

  /* ── Shake anim ── */
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }
  @keyframes popIn {
    from{transform:scale(0.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .pop { animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--neon);border-radius:99px;}

  /* ── Mobile ── */
  @media(max-width:480px){
    .choice-btn{width:90px;height:90px;}
    .choice-btn .emoji{font-size:2rem;}
    .score-num{font-size:1.8rem;}
  }
</style>
</head>
<body>

<!-- Animated blobs -->
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- Confetti canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- Achievement Toast -->
<div id="ach-toast">
  <div class="ach-toast-icon" id="ach-toast-icon">🏆</div>
  <div class="ach-toast-text">
    <div class="ach-toast-title" id="ach-toast-title">Achievement Unlocked!</div>
    <div id="ach-toast-desc"></div>
  </div>
</div>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-hands">✊✋✌️</div>
  <div class="splash-logo">RPS ARENA</div>
  <div class="splash-bar-wrap"><div class="splash-bar" id="splash-bar"></div></div>
  <div class="splash-tip" id="splash-tip">Loading arena...</div>
</div>

<!-- Main App -->
<div id="app">
  <header>
    <div class="logo">🎮 RPS Arena</div>
    <div class="header-actions">
      <button class="icon-btn" id="sound-btn" title="Toggle Sound">🔊</button>
      <button class="icon-btn" id="theme-btn" title="Toggle Theme">🌙</button>
    </div>
  </header>

  <!-- Score -->
  <div class="score-bar">
    <div class="score-card">
      <div class="score-label">You</div>
      <div class="score-num" id="score-player">0</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="score-card">
      <div class="score-label">AI</div>
      <div class="score-num" id="score-ai">0</div>
    </div>
  </div>

  <!-- Arena -->
  <div class="arena">
    <div class="ai-thinking" id="ai-thinking">
      <div class="think-label">🤖 AI is thinking...</div>
      <div class="think-dots">
        <div class="think-dot"></div>
        <div class="think-dot"></div>
        <div class="think-dot"></div>
      </div>
    </div>
    <div class="arena-hands">
      <div class="hand-slot player">
        <div class="hand-label">You</div>
        <span class="hand-emoji" id="player-hand">🤜</span>
        <div class="hand-name" id="player-name">—</div>
      </div>
      <div style="font-family:'Righteous',sans-serif;font-size:1.5rem;color:var(--text2);">VS</div>
      <div class="hand-slot ai">
        <div class="hand-label">AI</div>
        <span class="hand-emoji" id="ai-hand">🤛</span>
        <div class="hand-name" id="ai-name">—</div>
      </div>
    </div>
    <div class="result-text" id="result-text">Choose your weapon!</div>
  </div>

  <!-- Choices -->
  <div class="choices">
    <button class="choice-btn" onclick="play('rock')">
      <span class="emoji">✊</span>
      <span class="label">Rock</span>
    </button>
    <button class="choice-btn" onclick="play('paper')">
      <span class="emoji">✋</span>
      <span class="label">Paper</span>
    </button>
    <button class="choice-btn" onclick="play('scissors')">
      <span class="emoji">✌️</span>
      <span class="label">Scissors</span>
    </button>
  </div>

  <!-- Bottom Grid -->
  <div class="bottom-grid">
    <!-- Stats -->
    <div class="panel">
      <div class="panel-title">📈 Stats</div>
      <div class="stat-row">
        <span class="stat-label">Win Rate</span>
        <span class="stat-val" id="stat-winrate">0%</span>
      </div>
      <div class="stat-bar-wrap"><div class="stat-bar-fill" id="bar-winrate" style="width:0%"></div></div>
      <div style="height:10px"></div>
      <div class="stat-row">
        <span class="stat-label">Wins / Losses / Draws</span>
        <span class="stat-val" id="stat-wld">0/0/0</span>
      </div>
      <div style="height:10px"></div>
      <div class="stat-row">
        <span class="stat-label">Best Streak 🔥</span>
        <div class="streak-badge" id="stat-streak">0</div>
      </div>
      <div style="height:10px"></div>
      <div class="stat-row">
        <span class="stat-label">Total Rounds</span>
        <span class="stat-val" id="stat-total">0</span>
      </div>
    </div>

    <!-- Achievements -->
    <div class="panel">
      <div class="panel-title">🏆 Achievements</div>
      <div class="achievements-grid" id="achievements-grid"></div>
    </div>
  </div>

  <!-- History -->
  <div class="panel" style="margin-bottom:30px;">
    <div class="panel-title">📜 Match History</div>
    <div class="history-list" id="history-list">
      <div style="color:var(--text2);font-size:0.82rem;text-align:center;padding:20px;">No matches yet. Let's play!</div>
    </div>
  </div>
</div>

<script>
// ── State ──
let state = {
  player:0, ai:0, wins:0, losses:0, draws:0,
  streak:0, bestStreak:0, total:0, history:[],
  soundOn:true, theme:'dark', playing:false,
  achievements: {
    first_win:false, three_streak:false, five_wins:false,
    ten_games:false, comeback:false, draw_master:false
  }
};

const EMOJI = { rock:'✊', paper:'✋', scissors:'✌️' };
const NAMES = { rock:'Rock', paper:'Paper', scissors:'Scissors' };
const BEATS = { rock:'scissors', scissors:'paper', paper:'rock' };

// ── Sound Engine ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function getCtx(){ if(!ctx) ctx = new AudioCtx(); return ctx; }

function beep(freq,dur,type='sine',vol=0.3){
  if(!state.soundOn) return;
  try{
    const ac=getCtx(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
function playWin(){beep(523,0.1);setTimeout(()=>beep(659,0.1),120);setTimeout(()=>beep(784,0.2),240);}
function playLose(){beep(330,0.15,'sawtooth');setTimeout(()=>beep(220,0.2,'sawtooth'),180);}
function playDraw(){beep(440,0.15);setTimeout(()=>beep(440,0.15),200);}
function playClick(){beep(600,0.05,'square',0.15);}

// ── Confetti ──
const confCanvas = document.getElementById('confetti-canvas');
const confCtx = confCanvas.getContext('2d');
let confParts=[], confActive=false;
function resizeConf(){confCanvas.width=window.innerWidth;confCanvas.height=window.innerHeight;}
resizeConf(); window.addEventListener('resize',resizeConf);

function launchConfetti(){
  confParts=[];
  for(let i=0;i<140;i++) confParts.push({
    x:Math.random()*confCanvas.width, y:-10,
    vx:(Math.random()-0.5)*6, vy:Math.random()*4+3,
    color:`hsl(${Math.random()*360},90%,60%)`,
    r:Math.random()*7+3, rot:Math.random()*360, rotV:Math.random()*6-3,
    life:1
  });
  confActive=true; animConf();
}
function animConf(){
  confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
  confParts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV; p.vy+=0.1; p.life-=0.008;
    confCtx.save(); confCtx.translate(p.x,p.y); confCtx.rotate(p.rot*Math.PI/180);
    confCtx.globalAlpha=Math.max(0,p.life);
    confCtx.fillStyle=p.color;
    confCtx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.5);
    confCtx.restore();
  });
  confParts=confParts.filter(p=>p.life>0&&p.y<confCanvas.height+20);
  if(confParts.length>0) requestAnimationFrame(animConf);
  else { confActive=false; confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }
}

// ── Achievements ──
const ACHIEVEMENTS = [
  {id:'first_win',   icon:'🥇', name:'First Blood',    desc:'Win your first round'},
  {id:'three_streak',icon:'🔥', name:'On Fire',         desc:'Win 3 in a row'},
  {id:'five_wins',   icon:'⭐', name:'High Five',       desc:'Win 5 total rounds'},
  {id:'ten_games',   icon:'💎', name:'Dedicated',       desc:'Play 10 games'},
  {id:'comeback',    icon:'🦅', name:'Comeback King',   desc:'Win after 2 losses'},
  {id:'draw_master', icon:'🤝', name:'Draw Master',     desc:'Draw 3 times total'},
];

function renderAchievements(){
  const grid=document.getElementById('achievements-grid');
  grid.innerHTML = ACHIEVEMENTS.map(a=>`
    <div class="achievement ${state.achievements[a.id]?'unlocked':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
      </div>
      ${state.achievements[a.id]?'<span style="color:#fbbf24;font-size:0.7rem;">✓</span>':''}
    </div>
  `).join('');
}

function checkAchievements(result){
  const prev={...state.achievements};
  if(state.wins>=1) state.achievements.first_win=true;
  if(state.streak>=3) state.achievements.three_streak=true;
  if(state.wins>=5) state.achievements.five_wins=true;
  if(state.total>=10) state.achievements.ten_games=true;
  if(state.draws>=3) state.achievements.draw_master=true;
  // comeback: win after 2 consecutive losses
  if(result==='win' && state.history.length>=3){
    const last3=state.history.slice(-3);
    if(last3[0].result==='lose'&&last3[1].result==='lose'&&last3[2].result==='win')
      state.achievements.comeback=true;
  }
  ACHIEVEMENTS.forEach(a=>{
    if(!prev[a.id]&&state.achievements[a.id]) showAchToast(a);
  });
  renderAchievements();
}

function showAchToast(a){
  const t=document.getElementById('ach-toast');
  document.getElementById('ach-toast-icon').textContent=a.icon;
  document.getElementById('ach-toast-title').textContent=a.name;
  document.getElementById('ach-toast-desc').textContent=a.desc;
  t.classList.add('show');
  beep(880,0.08); setTimeout(()=>beep(1100,0.12),100);
  setTimeout(()=>t.classList.remove('show'),3500);
}

// ── Stats ──
function updateStats(){
  const total=state.wins+state.losses+state.draws;
  const wr=total>0?Math.round((state.wins/total)*100):0;
  document.getElementById('stat-winrate').textContent=wr+'%';
  document.getElementById('bar-winrate').style.width=wr+'%';
  document.getElementById('stat-wld').textContent=`${state.wins}/${state.losses}/${state.draws}`;
  document.getElementById('stat-streak').textContent=`${state.bestStreak} 🔥`;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('score-player').textContent=state.player;
  document.getElementById('score-ai').textContent=state.ai;
}

// ── History ──
function addHistory(playerChoice, aiChoice, result){
  state.history.unshift({playerChoice,aiChoice,result});
  if(state.history.length>30) state.history.pop();
  const list=document.getElementById('history-list');
  const map={win:'W',lose:'L',draw:'D'};
  list.innerHTML=state.history.map(h=>`
    <div class="history-item">
      <span>${EMOJI[h.playerChoice]} vs ${EMOJI[h.aiChoice]}</span>
      <span>${NAMES[h.playerChoice]} vs ${NAMES[h.aiChoice]}</span>
      <span class="badge ${h.result}">${map[h.result]}</span>
    </div>
  `).join('');
}

// ── Main Game Logic ──
function play(choice){
  if(state.playing) return;
  state.playing=true;
  playClick();

  // highlight chosen button
  document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
  event?.currentTarget?.classList.add('selected');

  // show AI thinking
  document.getElementById('ai-thinking').classList.add('active');
  document.getElementById('player-hand').textContent='🤜';
  document.getElementById('ai-hand').textContent='🤛';
  document.getElementById('player-name').textContent='...';
  document.getElementById('ai-name').textContent='...';
  document.getElementById('result-text').textContent='';
  document.getElementById('result-text').className='result-text';

  // animate countdown
  let count=0;
  const shakes=['🤜','✊','🤜','✊'];
  const iv=setInterval(()=>{
    document.getElementById('player-hand').textContent=shakes[count%shakes.length];
    document.getElementById('ai-hand').textContent=shakes[count%shakes.length];
    count++;
  },200);

  setTimeout(()=>{
    clearInterval(iv);
    document.getElementById('ai-thinking').classList.remove('active');

    const aiChoice=Object.keys(EMOJI)[Math.floor(Math.random()*3)];

    document.getElementById('player-hand').textContent=EMOJI[choice];
    document.getElementById('ai-hand').textContent=EMOJI[aiChoice];
    document.getElementById('player-name').textContent=NAMES[choice];
    document.getElementById('ai-name').textContent=NAMES[aiChoice];

    document.getElementById('player-hand').classList.add('pop');
    document.getElementById('ai-hand').classList.add('pop');
    setTimeout(()=>{
      document.getElementById('player-hand').classList.remove('pop');
      document.getElementById('ai-hand').classList.remove('pop');
    },400);

    let result, txt, cls;
    if(choice===aiChoice){
      result='draw'; txt="🤝 It's a Draw!"; cls='draw';
      state.draws++; state.streak=0;
      playDraw();
    } else if(BEATS[choice]===aiChoice){
      result='win'; txt='🎉 You Win!'; cls='win';
      state.wins++; state.player++; state.streak++;
      if(state.streak>state.bestStreak) state.bestStreak=state.streak;
      playWin(); launchConfetti();
    } else {
      result='lose'; txt='💀 AI Wins!'; cls='lose';
      state.losses++; state.ai++; state.streak=0;
      playLose();
    }
    state.total++;

    const rt=document.getElementById('result-text');
    rt.textContent=txt; rt.className='result-text '+cls;
    rt.classList.add('pop');

    addHistory(choice,aiChoice,result);
    updateStats();
    checkAchievements(result);

    document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
    state.playing=false;
  }, 1400);
}

// ── Theme Toggle ──
document.getElementById('theme-btn').addEventListener('click',()=>{
  playClick();
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('theme-btn').textContent = state.theme==='dark'?'🌙':'☀️';
});

// ── Sound Toggle ──
document.getElementById('sound-btn').addEventListener('click',()=>{
  state.soundOn=!state.soundOn;
  document.getElementById('sound-btn').textContent=state.soundOn?'🔊':'🔇';
});

// ── Splash Screen ──
const tips=['Loading arena...','Warming up AI...','Sharpening scissors...','Polishing rocks...','Ironing paper...'];
const splashBar=document.getElementById('splash-bar');
const splashTip=document.getElementById('splash-tip');
let prog=0;
const splashIv=setInterval(()=>{
  prog+=Math.random()*18+8;
  if(prog>100) prog=100;
  splashBar.style.width=prog+'%';
  splashTip.textContent=tips[Math.floor(Math.random()*tips.length)];
  if(prog>=100){
    clearInterval(splashIv);
    splashTip.textContent='Ready! 🎮';
    setTimeout(()=>{
      document.getElementById('splash').classList.add('hidden');
    },600);
  }
},150);

// ── Init ──
renderAchievements();
updateStats();
</script>
</body>
</html>
